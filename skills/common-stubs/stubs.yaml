schema: 1
stubs:
  editorconfig:
    description: Ensure text files end with a newline.
    path: assets/.editorconfig
    instructions: |
      Create or update the repository-root .editorconfig so that [*] sets
      insert_final_newline = true. Preserve and merge any existing settings
      instead of replacing the file wholesale.
  os-gitignore:
    description: Ignore operating system-generated files.
    path: assets/.gitignore
    instructions: |
      Merge the patterns from the supplied asset into the repository-root
      .gitignore. Preserve existing rules and comments, and avoid duplicate patterns.
      If .gitignore does not exist, create it from the asset.
  go-gitignore:
    description: Ignore operating go specific build artifacts
    path: assets/.gitignore-go
    instructions: |
      Merge the patterns from the supplied asset into the repository-root
      .gitignore. Preserve existing rules and comments, and avoid duplicate patterns.
      If .gitignore does not exist, create it from the asset.
  gitattributes:
    description: Pin LF line endings so Windows checkouts
    path: assets/.gitattributes
    instructions: |
      Create the repository-root .gitattributes from the asset. It forces LF
      checkouts on every OS (preventing CRLF lint failures on Windows)
      while keeping .bat/.cmd/.ps1 as CRLF. If .gitattributes already exists,
      merge instead of replacing, and run `git add --renormalize .` afterwards.
  python-gitignore:
    description: Ignore python specific artifacts
    path: assets/.gitignore-py
    instructions: |
      Merge the patterns from the supplied asset into the repository-root
      .gitignore. Preserve existing rules and comments, and avoid duplicate patterns.
      If .gitignore does not exist, create it from the asset.